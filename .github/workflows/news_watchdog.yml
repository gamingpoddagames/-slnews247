name: Keep SL News 247 scanning
on:
  schedule:
    - cron: '9,24,39,54 * * * *'
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  check-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Recover a missed news scan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import subprocess
          import urllib.request

          repo = os.environ['GH_REPO']
          url = f'https://api.github.com/repos/{repo}/actions/workflows/news.yml/runs?per_page=10'
          req = urllib.request.Request(url, headers={
              'Accept': 'application/vnd.github+json',
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'SLNews247-schedule-watchdog',
          })
          with urllib.request.urlopen(req, timeout=18) as response:
              data = json.load(response)
          runs = [r for r in data.get('workflow_runs', [])
                  if r.get('head_branch') == 'main']
          now = dt.datetime.now(dt.timezone.utc)
          latest = max(runs, key=lambda r: r.get('created_at', ''), default=None)
          if latest:
              created = dt.datetime.fromisoformat(latest['created_at'].replace('Z', '+00:00'))
              age = (now - created).total_seconds() / 60
              print(f'Latest news scan: {age:.1f} minutes ago; status={latest["status"]}')
              # Avoid duplicate scans. A running or queued job may need a
              # little longer than the watchdog's normal cadence.
              if age < 20 or latest.get('status') in ('in_progress', 'queued', 'waiting', 'pending'):
                  print('No recovery dispatch necessary.')
                  raise SystemExit(0)
          print('No recent news run; requesting one production dispatch.')
          subprocess.run(['gh', 'workflow', 'run', 'news.yml',
                          '--ref', 'main', '-f', 'publish=true'], check=True)
          PY
