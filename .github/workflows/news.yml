name: Auto News Bot
on:
  schedule:
    - cron: '2-59/5 * * * *'
  push:
    paths:
      - '*.py'
      - 'tests/**'
      - 'requirements.txt'
      - 'data/urgent_news.json'
      - '.github/workflows/news.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to configured news accounts (false = preview only)'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: sinhala-news-production
  cancel-in-progress: true
jobs:
  run:
    # Stable LTS image prevents slow / inconsistent development Ubuntu package mirrors.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install renderer and Sinhala fonts
        timeout-minutes: 6
        run: |
          set -e
          need_fonts=true
          test -f /usr/share/fonts/truetype/noto/NotoSansSinhala-Regular.ttf && need_fonts=false
          need_ffmpeg=true
          command -v ffmpeg >/dev/null 2>&1 && need_ffmpeg=false
          if [ "$need_fonts" = true ] || [ "$need_ffmpeg" = true ]; then
            sudo timeout 150s apt-get update -qq
            packages=""
            if [ "$need_fonts" = true ]; then packages="$packages fonts-noto-core"; fi
            if [ "$need_ffmpeg" = true ]; then packages="$packages ffmpeg"; fi
            sudo DEBIAN_FRONTEND=noninteractive timeout 170s apt-get install -y --no-install-recommends $packages
          fi
          pip install -r requirements.txt
          python -c "from image import get_font; get_font(32)"
          ffmpeg -version | head -n 1
      - name: Verify feed parsing and delivery checkpoints
        run: |
          mkdir -p data
          set +e
          python -m unittest discover -s tests -v > data/ci_test_results.txt 2>&1
          status=$?
          tail -n 150 data/ci_test_results.txt
          exit "$status"
      - name: Run news pipeline
        env:
          PREVIEW_ONLY: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_ENABLED: ${{ vars.TIKTOK_ENABLED || 'false' }}
          TIKTOK_PRIVACY_LEVEL: ${{ vars.TIKTOK_PRIVACY_LEVEL || 'SELF_ONLY' }}
          MYMEMORY_EMAIL: ${{ secrets.MYMEMORY_EMAIL }}
          MAX_NEWS_PER_RUN: '30'
        run: python -u fast_news.py
      - name: Preserve delivery checkpoints and translation cache
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.publish)
        run: |
          mkdir -p data
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Preserve local delivery state, then merge it with the latest remote
          # records. Do not rebase checkpoint JSON files with conflicting edits.
          snapshot=$(mktemp -d)
          for file in data/sri_lanka_delivery.json data/source_health.json data/translation_cache.json used.json; do
            if [ -f "$file" ]; then cp "$file" "$snapshot/$(basename "$file")"; fi
          done
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/merge_news_checkpoint.py "$snapshot"
            git add -A -- data/sri_lanka_delivery.json data/source_health.json
            if [ -f data/translation_cache.json ]; then git add data/translation_cache.json; fi
            if [ -f used.json ]; then git add used.json; fi
            if git diff --cached --quiet; then break; fi
            git commit -m 'Record news delivery checkpoints'
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" -eq 3 ]; then echo "Unable to save checkpoints after 3 retries"; exit 1; fi
          done
      - name: Save preview and delivery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sinhala-news-${{ github.run_id }}
          path: output/
          retention-days: 7
