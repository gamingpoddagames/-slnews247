name: Auto News Bot
on:
  schedule:
    - cron: '2-59/5 * * * *'  # Off the crowded top-of-hour boundary
  push:
    paths:
      - '*.py'
      - 'tests/**'
      - 'scripts/**'
      - 'assets/verified_photos/**'
      - 'requirements.txt'
      - 'data/urgent_news.json'
      - 'data/editorial_briefs.json'
      - 'data/verified_event_media.json'
      - 'data/news_heartbeat.json'
      - '.github/workflows/news.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to configured news accounts (disable for preview only)'
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: sinhala-news-production
  cancel-in-progress: false
jobs:
  run:
    # Stable LTS image prevents slow / inconsistent development Ubuntu package mirrors.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install portable renderer and Sinhala fonts
        timeout-minutes: 6
        run: |
          set -e
          python -m pip install -r requirements.txt
          mkdir -p assets/sinhala_fonts "$RUNNER_TEMP/newsbin"
          # Google Fonts' Noto Sans Sinhala (SIL Open Font License).
          curl -fLsS --retry 3 --max-time 75 \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssinhala/NotoSansSinhala%5Bwdth%2Cwght%5D.ttf' \
            -o assets/sinhala_fonts/NotoSansSinhala-Variable.ttf
          test "$(wc -c < assets/sinhala_fonts/NotoSansSinhala-Variable.ttf)" -gt 100000
          FFMPEG_BINARY=$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')
          ln -sf "$FFMPEG_BINARY" "$RUNNER_TEMP/newsbin/ffmpeg"
          echo "$RUNNER_TEMP/newsbin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/newsbin:$PATH"
          python -c "from image import get_font; get_font(32)"
          ffmpeg -version | head -n 1
          # The Ubuntu hosted runner already includes ffprobe. Avoid apt-get
          # update/install: package-mirror stalls previously timed out this job.
          if command -v ffprobe >/dev/null 2>&1; then
            ffprobe -version | head -n 1
          else
            echo "::warning::ffprobe unavailable; licensed video probing may be skipped"
          fi
      - name: Verify feed parsing and delivery checkpoints
        run: |
          mkdir -p data
          set +e
          python -m unittest discover -s tests -v > data/ci_test_results.txt 2>&1
          status=$?
          tail -n 150 data/ci_test_results.txt
          exit "$status"
      - name: Smoke-test real three-scene video encoding
        if: github.event_name == 'push'
        timeout-minutes: 3
        run: python -m scripts.video_smoke
      - name: Refresh remote delivery state immediately before publishing
        # Queued runs may have checked out the same stale commit. Fetch again
        # after the preceding production run has saved its receipts.
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          git show origin/main:data/sri_lanka_delivery.json > data/sri_lanka_delivery.json
          python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path('data/sri_lanka_delivery.json').read_text())
          print('Fresh production state: {} article receipts, {} video bulletin journals'.format(
              len(state.get('stories', {})), len(state.get('bulletins', {}))))
          PY
      - name: Run news pipeline
        env:
          PREVIEW_ONLY: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_ENABLED: ${{ vars.TIKTOK_ENABLED || 'false' }}
          TIKTOK_PRIVACY_LEVEL: ${{ vars.TIKTOK_PRIVACY_LEVEL || 'SELF_ONLY' }}
          # Dedicated SL NEWS account: NEVER reuse a trading TikTok token.
          SLNEWS_TIKTOK_ACCESS_TOKEN: ${{ secrets.SLNEWS_TIKTOK_ACCESS_TOKEN }}
          SLNEWS_TIKTOK_EXPECTED_OPEN_ID: ${{ secrets.SLNEWS_TIKTOK_EXPECTED_OPEN_ID }}
          SLNEWS_TIKTOK_EXPECTED_USERNAME: ${{ vars.SLNEWS_TIKTOK_EXPECTED_USERNAME }}
          SLNEWS_TIKTOK_MODE: ${{ vars.SLNEWS_TIKTOK_MODE || 'off' }}
          SLNEWS_TIKTOK_APP_AUDITED: ${{ vars.SLNEWS_TIKTOK_APP_AUDITED || 'false' }}
          SLNEWS_TIKTOK_MAX_PER_DAY: '2'
          MYMEMORY_EMAIL: ${{ secrets.MYMEMORY_EMAIL }}
          MAX_NEWS_PER_RUN: '3'
          ALLOW_HEADLINE_CARD_FALLBACK: 'true'
          ARTICLE_PREVIEW_FALLBACK: 'false'
          EXTERNAL_NEWS_LINK_POSTS: 'false'
          MAX_REELS_PER_RUN: '2'
          STORY_REELS_ENABLED: 'true'
          REELS_REQUIRE_EVENT_MEDIA: 'true'
        run: python -u fast_news.py
      - name: Preserve delivery checkpoints and translation cache
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.publish)
        run: |
          mkdir -p data
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Preserve local delivery state, then merge it with the latest remote
          # records. Do not rebase checkpoint JSON files with conflicting edits.
          snapshot=$(mktemp -d)
          for file in data/sri_lanka_delivery.json data/source_health.json data/translation_cache.json used.json; do
            if [ -f "$file" ]; then cp "$file" "$snapshot/$(basename "$file")"; fi
          done
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/merge_news_checkpoint.py "$snapshot"
            git add -A -- data/sri_lanka_delivery.json data/source_health.json
            if [ -f data/translation_cache.json ]; then git add data/translation_cache.json; fi
            if [ -f used.json ]; then git add used.json; fi
            if git diff --cached --quiet; then break; fi
            git commit -m 'Record news delivery checkpoints'
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" -eq 3 ]; then echo "Unable to save checkpoints after 3 retries"; exit 1; fi
          done
      - name: Save preview and delivery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sinhala-news-${{ github.run_id }}
          path: output/
          retention-days: 7
