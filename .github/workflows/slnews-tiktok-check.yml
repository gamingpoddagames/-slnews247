name: SL News TikTok connection check
on:
  push:
    paths:
      - '.github/workflows/slnews-tiktok-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet requests
      - name: Check news account authorization (no publishing)
        env:
          SLNEWS_TIKTOK_MODE: ${{ vars.SLNEWS_TIKTOK_MODE || 'off' }}
          SLNEWS_TIKTOK_ACCESS_TOKEN: ${{ secrets.SLNEWS_TIKTOK_ACCESS_TOKEN }}
          SLNEWS_TIKTOK_EXPECTED_OPEN_ID: ${{ secrets.SLNEWS_TIKTOK_EXPECTED_OPEN_ID }}
          SLNEWS_TIKTOK_EXPECTED_USERNAME: ${{ vars.SLNEWS_TIKTOK_EXPECTED_USERNAME }}
        run: python -m scripts.check_slnews_tiktok
