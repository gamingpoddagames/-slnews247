name: Cache verified CBSL photo for news
on:
  push:
    paths:
      - '.github/workflows/cache_cbsl_photo.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download and pin original CC BY building photo
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import pathlib
          import urllib.request
          root='https://upload.wikimedia.org/wikipedia/commons/2/25/Sri_lanka2024.png'
          alternatives=[root,
                        'https://en.wikipedia.org/wiki/Special:Redirect/file/Sri_lanka2024.png',
                        'https://commons.wikimedia.org/wiki/Special:Redirect/file/Sri_lanka2024.png']
          expected='32d3dcfbd8153ce7e3e155f149dd7c166ef14b23'
          headers={
              'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130.0 Safari/537.36',
              'Referer':'https://commons.wikimedia.org/wiki/File:Sri_lanka2024.png',
              'Accept':'image/avif,image/webp,image/png,image/*;q=0.8'
          }
          photo=None
          for url in alternatives:
              try:
                  req=urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=17) as response:
                      data=response.read(2000000)
                  if hashlib.sha1(data).hexdigest()==expected:
                      photo=data
                      break
                  print('Image bytes do not match pinned Commons SHA-1; skipping host')
              except Exception as exc:
                  print('Vetted image host unavailable:', type(exc).__name__)
          if photo is None:
              raise SystemExit('Unable to obtain the exact licensed CBSL building image')
          target=pathlib.Path('assets/verified_photos/cbsl_building.png.b64')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(base64.b64encode(photo).decode('ascii')+'\n', encoding='ascii')
          print('Pinned verified photo, bytes:', len(photo), 'SHA-1:',expected)
          PY
      - name: Commit permanent licensed photo cache
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/verified_photos/cbsl_building.png.b64
          if git diff --cached --quiet; then
            echo 'Photo already pinned; no change.'
            exit 0
          fi
          git commit -m 'Pin verified Creative Commons Central Bank building image for news'
          for n in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
          done
          echo 'Could not commit verified building photo' >&2
          exit 1
