name: Test verified Commons photo access
on:
  push:
    paths:
      - '.github/workflows/photo_probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  photo-access:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check vetted bank building photo URLs without publishing
        run: |
          python - <<'PY'
          import hashlib
          import urllib.error
          import urllib.request
          from urllib.parse import quote
          root = 'https://upload.wikimedia.org/wikipedia/commons/2/25/Sri_lanka2024.png'
          urls = [
              ('commons-upload', root),
              ('commons-browser', root),
              ('wikipedia-special', 'https://en.wikipedia.org/wiki/Special:Redirect/file/Sri_lanka2024.png'),
              ('commons-special', 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Sri_lanka2024.png'),
              ('weserv', 'https://images.weserv.nl/?url='+quote(root, safe='')),
              ('wsrv', 'https://wsrv.nl/?url='+quote(root, safe='')),
              ('commons-thumb', 'https://upload.wikimedia.org/wikipedia/commons/thumb/2/25/Sri_lanka2024.png/772px-Sri_lanka2024.png'),
          ]
          for name,url in urls:
              headers={'User-Agent': 'SLNews247/1.0 (license-compliant Wikimedia Commons usage)',
                       'Accept': 'image/*'}
              if name=='commons-browser':
                  headers={'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130.0 Safari/537.36',
                           'Referer': 'https://commons.wikimedia.org/wiki/File:Sri_lanka2024.png',
                           'Accept':'image/avif,image/webp,image/png,image/*;q=0.8'}
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=13) as r:
                      body = r.read(7_000_000)
                      print(name, r.status, len(body), r.headers.get('Content-Type'),
                            'sha1='+hashlib.sha1(body).hexdigest(),
                            'signature='+repr(body[:8]))
              except Exception as exc:
                  print(name, type(exc).__name__, str(exc)[:160])
          PY
      - name: Verify real production photo downloader
        run: |
          python -m pip install --quiet Pillow requests
          python - <<'PY'
          from institution_photo import select_institution_photo
          photo, credit = select_institution_photo(
              {'title_si': 'ශ්‍රී ලංකා මහ බැංකුව පොලී අනුපාතය වෙනස් කරයි'})
          assert photo and credit['creator'] == 'Zsastaba', 'vetted image missing'
          from PIL import Image
          with Image.open(photo) as im:
              print('Verified actual bank building:', photo, im.size, credit['license'])
          PY
